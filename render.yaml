services:
  - type: web
    name: financas-coopex
    env: python
    plan: starter
    autoDeploy: false
    buildCommand: pip install -r requirements.txt
    startCommand: >
      gunicorn enhanced_app:app
      --bind 0.0.0.0:$PORT
      --worker-class gthread
      --workers ${WEB_CONCURRENCY:-1}
      --threads ${GTHREADS:-4}
      --timeout 120
      --graceful-timeout 30
      --keep-alive 30
      --max-requests 700
      --max-requests-jitter 70
      --access-logfile /dev/null
      --error-logfile -
      --log-level info
    healthCheckPath: /healthz/upgrade
    envVars:
      - key: TZ
        value: America/Sao_Paulo
      - key: PYTHON_VERSION
        value: 3.12.5
      - key: FLASK_ENV
        value: production
      - key: PYTHONUTF8
        value: "1"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: GTHREADS
        value: "4"
      - key: DB_TARGET_CONNS
        value: "20"
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
