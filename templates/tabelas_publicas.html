<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tabelas</title>
<style>
:root{--blue:#064fc8;--blue2:#083c9e;--bg:#f4f7fc;--text:#102044;--muted:#6c7890;--line:#cfe0fb;--white:#fff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select{font:inherit}.app{max-width:430px;margin:0 auto;padding:8px 10px 98px}.section{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px;margin-bottom:8px;box-shadow:0 5px 16px rgba(6,79,200,.06)}
.topline{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 2px 8px}.back{color:var(--blue);font-weight:900;text-decoration:none;font-size:12px}
.select-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}select,.clear{height:44px;border:1px solid #bcd4f8;border-radius:12px;background:#fff;padding:0 11px;font-weight:850;color:var(--text)}.clear{color:var(--blue);cursor:pointer}
.mode{margin-top:8px;display:grid;grid-template-columns:1fr 1fr;background:#e8f0fc;padding:3px;border-radius:12px}.mode button{border:0;background:transparent;min-height:36px;border-radius:10px;font-weight:900;color:#5f6f89;cursor:pointer}.mode button.active{background:var(--blue);color:#fff}
.search{position:relative;margin-top:8px}.search span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--blue)}.search input{width:100%;height:42px;border:1px solid #bcd4f8;border-radius:12px;padding:0 12px 0 38px;font-size:15px;outline:none}
.head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}.head strong{font-size:14px}.head span{font-size:11px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.card{min-height:84px;border:1.5px solid #bcd4f8;border-radius:13px;padding:9px 10px;text-align:left;background:#fff;display:flex;flex-direction:column;justify-content:space-between;gap:6px;cursor:pointer;position:relative;overflow:hidden}.card:active{background:#f2f7ff}.name{font-size:15.5px;font-weight:950;line-height:1.12;white-space:normal;word-break:normal}.price{font-size:19px;font-weight:950;color:var(--blue);white-space:nowrap}.meta{font-size:10px;color:var(--muted)}.pill{position:absolute;right:7px;bottom:7px;min-width:30px;height:28px;border-radius:999px;padding:0 8px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:950;box-shadow:0 2px 6px rgba(6,79,200,.22)}
.info-line{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid #e8eef8}.info-line:last-child{border-bottom:0}.info-line b{font-size:12px}.info-line strong{font-size:17px;color:var(--blue);white-space:nowrap}.sub{font-size:10px;color:var(--muted);margin-top:2px}
.empty{padding:18px;border:1px dashed var(--line);border-radius:12px;text-align:center;color:var(--muted);font-size:12px}
.drawer{position:fixed;left:0;right:0;bottom:0;max-width:430px;margin:0 auto;padding:0 10px 10px;z-index:40}.total{width:100%;border:0;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;border-radius:16px;padding:11px 14px;display:grid;grid-template-columns:1fr auto;align-items:center;box-shadow:0 12px 28px rgba(6,79,200,.28);cursor:pointer}.total span{display:block;font-size:10px;opacity:.8}.total strong{display:block;font-size:22px;margin-top:2px}.right{text-align:right}.summary{margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 16px 36px rgba(6,79,200,.14);max-height:0;overflow:hidden;transition:max-height .2s}.summary.open{max-height:360px}.summary h3{margin:0;padding:11px 13px;border-bottom:1px solid #edf1f6;font-size:14px}.sumlist{max-height:300px;overflow:auto;padding:0 12px 10px}.row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #edf1f6}.row:last-child{border-bottom:0}.row .n{font-size:12px;font-weight:900}.row .m{font-size:10px;color:var(--muted);margin-top:2px}.qty{display:flex;align-items:center;gap:4px}.qty button{width:30px;height:30px;border:1px solid var(--line);background:#fff;border-radius:9px;font-weight:900;color:var(--blue)}.qty b{min-width:24px;text-align:center}
@media(min-width:760px){.app,.drawer{max-width:760px}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="app">
  <div class="topline"><a class="back" href="{{ back_href or url_for('portal_cooperado') }}">← Voltar</a></div>

  <section class="section">
    <div class="select-row">
      <select id="contract">
        <option value="">Selecione o estabelecimento</option>
        {% for t in tabelas %}<option value="{{ t.id }}">{{ t.titulo }}</option>{% endfor %}
      </select>
      <button id="clear" class="clear" type="button">Zerar</button>
    </div>
    <div class="mode">
      <button id="consult" type="button">Consultar</button>
      <button id="calc" type="button" class="active">Calcular</button>
    </div>
    <div class="search"><span>⌕</span><input id="search" placeholder="Buscar bairro"></div>
  </section>

  <section class="section">
    <div class="head"><strong>Bairros</strong><span id="count">0 bairros</span></div>
    <div id="grid" class="grid"><div class="empty" style="grid-column:1/-1">Selecione um estabelecimento.</div></div>
  </section>

  <section id="extras" class="section" style="display:none">
    <div class="head"><strong>Outros valores</strong></div>
    <div id="extraList"></div>
  </section>

  <section id="guarantees" class="section" style="display:none">
    <div class="head"><strong>Garantidos</strong></div>
    <div id="guaranteeList"></div>
  </section>

  </div>

<div class="drawer">
  <button id="totalBtn" class="total" type="button">
    <div><span>Total</span><strong id="totalValue">R$ 0,00</strong></div>
    <div class="right"><strong id="totalQty">0</strong><span>entregas</span></div>
  </button>
  <div id="summary" class="summary"><h3>Resumo do cálculo</h3><div id="sumList" class="sumlist"><div class="empty">Nenhuma entrega adicionada.</div></div></div>
</div>

<script>
const contract=document.getElementById('contract'), search=document.getElementById('search'), grid=document.getElementById('grid'), count=document.getElementById('count');
const guarantees=document.getElementById('guarantees'), guaranteeList=document.getElementById('guaranteeList'), extras=document.getElementById('extras'), extraList=document.getElementById('extraList');
const totalValue=document.getElementById('totalValue'), totalQty=document.getElementById('totalQty'), summary=document.getElementById('summary'), sumList=document.getElementById('sumList');
let mode='calc', data=[], counts={};
const money=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(v||0));
const key=x=>x.bairro+'||'+(x.cidade||'');

function renderGrid(){
  const q=search.value.trim().toLocaleLowerCase('pt-BR');
  const rows=[...data].filter(x=>!q||x.bairro.toLocaleLowerCase('pt-BR').includes(q)).sort((a,b)=>a.bairro.localeCompare(b.bairro,'pt-BR'));
  count.textContent=rows.length+' bairros';
  if(!rows.length){grid.innerHTML='<div class="empty" style="grid-column:1/-1">Nenhum bairro encontrado.</div>';return}
  grid.innerHTML=rows.map(x=>{
    const qty=counts[key(x)]||0;
    return `<button class="card" data-name="${x.bairro.replace(/"/g,'&quot;')}" data-city="${(x.cidade||'').replace(/"/g,'&quot;')}" data-price="${x.valor}">
      <div class="name">${x.bairro}</div>
      <div><div class="price">${money(x.valor)}</div><div class="meta">${mode==='calc'?(qty?'Quantidade: '+qty:'Toque para somar'):'Toque para consultar'}</div></div>
      ${qty?'<div class="pill">'+qty+'x</div>':''}
    </button>`;
  }).join('');
  grid.querySelectorAll('.card').forEach(btn=>btn.onclick=()=>{
    if(mode!=='calc') return;
    const k=btn.dataset.name+'||'+btn.dataset.city;
    counts[k]=(counts[k]||0)+1;
    renderGrid(); renderSummary();
  });
}

function renderSummary(){
  const rows=[];
  Object.entries(counts).forEach(([k,qty])=>{
    if(qty<=0)return;
    const [name,city]=k.split('||');
    const x=data.find(v=>v.bairro===name&&(v.cidade||'')===city);
    if(x)rows.push({name,city,price:Number(x.valor||0),qty});
  });
  totalQty.textContent=rows.reduce((s,r)=>s+r.qty,0);
  totalValue.textContent=money(rows.reduce((s,r)=>s+r.qty*r.price,0));
  if(!rows.length){sumList.innerHTML='<div class="empty">Nenhuma entrega adicionada.</div>';return}
  sumList.innerHTML=rows.map(r=>`<div class="row"><div><div class="n">${r.name}</div><div class="m">${money(r.price)} × ${r.qty} = <b>${money(r.price*r.qty)}</b></div></div><div class="qty"><button data-a="-" data-k="${r.name}||${r.city}">−</button><b>${r.qty}</b><button data-a="+" data-k="${r.name}||${r.city}">+</button></div></div>`).join('');
  sumList.querySelectorAll('button').forEach(b=>b.onclick=()=>{counts[b.dataset.k]=Math.max(0,(counts[b.dataset.k]||0)+(b.dataset.a==='+'?1:-1));renderSummary();renderGrid()});
}

async function load(id){
  counts={};data=[];renderSummary();guarantees.style.display='none';extras.style.display='none';
  if(!id){count.textContent='0 bairros';grid.innerHTML='<div class="empty" style="grid-column:1/-1">Selecione um estabelecimento.</div>';return}
  grid.innerHTML='<div class="empty" style="grid-column:1/-1">Carregando...</div>';
  try{
    const r=await fetch('/tabelas/'+id+'/dados',{credentials:'same-origin',cache:'no-store'}), j=await r.json();
    if(!r.ok||!j.ok)throw new Error(j.erro||'Falha ao carregar');

    if(j.estruturada && (j.bairros||[]).length){
      data=j.bairros||[];renderGrid();
    }else{
      grid.innerHTML='<div class="empty" style="grid-column:1/-1">Nenhum bairro cadastrado nesta tabela.</div>';
      count.textContent='0 bairros';
    }

    const gs=j.garantidos||[];
    if(gs.length){
      guaranteeList.innerHTML=gs.map(g=>`<div class="info-line"><div><b>${g.descricao||'Garantido'}</b><div class="sub">${g.horario||''}</div></div><strong>${money(g.valor)}</strong></div>`).join('');
      guarantees.style.display='block';
    }

    const ex=j.extras||{}, rows=[];
    if(ex.servico_compras!=null) rows.push(['Serviço de compras',ex.servico_compras]);
    if(ex.transferencia_lojas!=null) rows.push(['Transferência entre lojas',ex.transferencia_lojas]);
    if(rows.length){
      extraList.innerHTML=rows.map(([n,v])=>`<div class="info-line"><b>${n}</b><strong>${money(v)}</strong></div>`).join('');
      extras.style.display='block';
    }
  }catch(e){
    count.textContent='Erro';grid.innerHTML='<div class="empty" style="grid-column:1/-1">Não foi possível carregar esta tabela.</div>';
  }
}

document.getElementById('calc').onclick=()=>{mode='calc';document.getElementById('calc').classList.add('active');document.getElementById('consult').classList.remove('active');renderGrid()};
document.getElementById('consult').onclick=()=>{mode='consult';document.getElementById('consult').classList.add('active');document.getElementById('calc').classList.remove('active');renderGrid()};
document.getElementById('clear').onclick=()=>{counts={};renderSummary();renderGrid()};
search.oninput=renderGrid;contract.onchange=e=>load(e.target.value);document.getElementById('totalBtn').onclick=()=>summary.classList.toggle('open');
renderSummary();if(contract.value)load(contract.value);setTimeout(()=>{if(contract.value)load(contract.value)},250);
</script>
</body>
</html>
