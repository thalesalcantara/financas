<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Tabelas por Estabelecimento</title>
  <style>
    :root{--bg:#eef3f9;--card:#fff;--text:#182335;--muted:#74839a;--border:#e2e8f0;--blue:#0b57e3;--blue2:#17315f}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
    body{background:linear-gradient(180deg,#f8fbff 0,#eef3f9 100%)}
    .app{max-width:430px;margin:0 auto;padding:12px 12px 28px}
    .hero{background:linear-gradient(135deg,#0b57e3 0%,#153b83 52%,#06275d 100%);color:#fff;border-radius:24px;padding:18px 16px;box-shadow:0 18px 40px rgba(20,35,70,.20)}
    .hero h1{margin:0;font-size:20px;font-weight:900}.hero p{margin:5px 0 0;font-size:12px;opacity:.84}
    .section{margin-top:12px;background:#fff;border:1px solid var(--border);border-radius:20px;padding:12px;box-shadow:0 7px 22px rgba(20,40,70,.06)}
    label{display:block;font-size:11px;color:var(--muted);font-weight:900;text-transform:uppercase;margin-bottom:6px}
    select{width:100%;height:46px;border:1px solid var(--border);border-radius:14px;background:#fff;padding:0 12px;font-weight:800;color:var(--text)}
    .viewer{margin-top:12px;border:1px solid var(--border);border-radius:20px;overflow:hidden;background:#fff;min-height:540px}
    iframe{display:block;width:100%;height:72vh;min-height:540px;border:0;background:#fff}
    .empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:13px}
    .back{display:inline-flex;margin-top:10px;color:#fff;text-decoration:none;font-size:12px;font-weight:800}
    @media(min-width:760px){.app{max-width:760px}.viewer{min-height:650px}iframe{min-height:650px;height:76vh}}
  </style>
</head>
<body>
<div class="app">
  <section class="hero">
    <h1>Taxas por Bairro</h1>
    <p>Selecione o estabelecimento para consultar a tabela de entregas.</p>
    <a class="back" href="{{ back_href or url_for('portal_cooperado') }}">← Voltar</a>
  </section>

  <section class="section">
    <label for="tableSelect">Estabelecimento</label>
    <select id="tableSelect">
      <option value="">Selecione um estabelecimento</option>
      {% for t in tabelas %}
      <option value="{{ url_for('tabela_abrir', tab_id=t.id) }}">{{ t.titulo }}</option>
      {% endfor %}
    </select>
  </section>

  <div class="viewer" id="viewer">
    <div class="empty" id="emptyState">Selecione um estabelecimento para abrir a tabela.</div>
    <iframe id="frame" hidden title="Tabela de taxas"></iframe>
  </div>
</div>
<script>
const sel=document.getElementById('tableSelect');
const frame=document.getElementById('frame');
const empty=document.getElementById('emptyState');
sel.addEventListener('change',()=>{
  const url=sel.value;
  if(!url){frame.hidden=true;frame.src='';empty.hidden=false;return}
  empty.hidden=true;frame.hidden=false;frame.src=url;
});
</script>
</body>
</html>
