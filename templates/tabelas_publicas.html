<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Taxas por Bairro</title>
<style>
:root{--bg:#eef3f9;--card:#fff;--text:#182335;--muted:#74839a;--border:#e2e8f0;--blue:#0b57e3;--dark:#101828}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select{font:inherit}
body{background:linear-gradient(180deg,#f8fbff 0,#eef3f9 100%)}
.app{max-width:430px;margin:0 auto;padding:12px 12px 96px}
.hero{background:linear-gradient(135deg,#0757d9 0%,#103c8d 48%,#06275d 100%);color:#fff;border-radius:24px;padding:17px 16px;box-shadow:0 18px 40px rgba(20,35,70,.20)}
.hero h1{margin:0;font-size:20px;font-weight:900}.hero p{margin:5px 0 0;font-size:12px;opacity:.82}
.back{display:inline-flex;margin-top:9px;color:#fff;text-decoration:none;font-size:11px;font-weight:900}
.section{margin-top:12px;background:#fff;border:1px solid var(--border);border-radius:20px;padding:12px;box-shadow:0 7px 22px rgba(20,40,70,.06)}
.select-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
select,.clear{height:44px;border:1px solid var(--border);border-radius:14px;background:#fff;padding:0 12px;font-weight:800}
.clear{background:#fff4f4;color:#bd2b2b;border-color:#ffd1d1;cursor:pointer}
.mode{margin-top:10px;display:grid;grid-template-columns:1fr 1fr;background:#edf1f7;padding:4px;border-radius:15px}
.mode button{border:0;background:transparent;min-height:38px;border-radius:12px;font-weight:900;color:#677386;cursor:pointer}
.mode button.active{background:#fff;color:var(--blue);box-shadow:0 2px 8px rgba(20,40,75,.08)}
.search-wrap{position:relative;margin-top:10px}.search-wrap span{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#7a879a}
.search-wrap input{width:100%;height:44px;border:1px solid var(--border);border-radius:14px;padding:0 12px 0 40px;font-size:15px;outline:none;background:#fbfcfe}
.last{margin-top:10px;background:#f8fbff;border:1px solid var(--border);border-radius:16px;padding:11px}
.last .label{font-size:9px;color:var(--muted);text-transform:uppercase;font-weight:900;letter-spacing:.05em}.last .name{margin-top:5px;font-size:16px;font-weight:900}.last .price{font-size:27px;font-weight:950;margin-top:6px}.last .meta{font-size:10px;color:var(--muted);margin-top:3px}
.guarantees{display:none}.guarantees.show{display:block}.g-title{font-size:13px;font-weight:900;margin-bottom:8px}
.g-line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #edf1f6}.g-line:last-child{border-bottom:0}
.g-line .d{font-size:12px;font-weight:900}.g-line .h{font-size:10px;color:var(--muted);margin-top:2px}.g-line .v{font-size:17px;font-weight:950;color:var(--blue);white-space:nowrap}
.info{display:none}.info.show{display:block}.info div{font-size:11px;line-height:1.45;padding:6px 0;border-bottom:1px solid #eef1f5}.info div:last-child{border-bottom:0}
.headline{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.headline strong{font-size:14px}.headline span{font-size:11px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.card{min-height:64px;border:1px solid var(--border);border-radius:14px;padding:8px 10px;text-align:left;display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;position:relative;box-shadow:0 4px 12px rgba(20,40,70,.05)}
.card:active{transform:scale(.985)}.card .name{font-size:16.5px;font-weight:950;line-height:1.08;padding-right:24px}.card .price{font-size:18px;font-weight:950;margin-top:0;white-space:nowrap}.card .meta{font-size:9px;color:#617086;margin-top:3px;text-align:right}.card .city{font-size:9px;color:#7b879a;margin-top:2px}.card .pill{position:absolute;right:9px;top:9px;min-width:24px;height:24px;border-radius:999px;padding:0 7px;background:rgba(17,24,39,.09);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900}
.c0{background:linear-gradient(180deg,#eff6ff,#fbfdff);border-color:#d7e8ff}.c1{background:linear-gradient(180deg,#f0faf2,#fbfdfb);border-color:#d5edd9}.c2{background:linear-gradient(180deg,#fff8e8,#fffdf8);border-color:#f4e0b6}.c3{background:linear-gradient(180deg,#fff1fa,#fffafd);border-color:#f1d1e7}.c4{background:linear-gradient(180deg,#f5f1ff,#fbfaff);border-color:#dfd6ff}.c5{background:linear-gradient(180deg,#fff1ef,#fffafa);border-color:#ffd8d2}
.drawer{position:fixed;left:0;right:0;bottom:0;max-width:430px;margin:0 auto;padding:0 10px 10px;z-index:30}
.total-btn{width:100%;border:0;background:#111827;color:#fff;border-radius:18px;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;box-shadow:0 18px 36px rgba(17,24,39,.28);cursor:pointer}
.total-btn span{display:block;font-size:10px;opacity:.72}.total-btn strong{display:block;font-size:22px;margin-top:2px}.total-btn .r{text-align:right}.total-btn .r b{display:block;font-size:13px}.total-btn .r small{font-size:10px;opacity:.72}
.summary{margin-top:8px;background:#fff;border:1px solid var(--border);border-radius:20px;box-shadow:0 18px 40px rgba(18,35,65,.14);max-height:0;overflow:hidden;transition:max-height .22s ease}.summary.open{max-height:360px}.summary-head{padding:12px 14px;border-bottom:1px solid #edf1f6;font-weight:900;font-size:14px}.summary-list{max-height:295px;overflow:auto;padding:0 14px 10px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:11px 0;border-bottom:1px solid #eef1f5}.row:last-child{border-bottom:0}.row .n{font-size:12px;font-weight:900}.row .m{font-size:10px;color:var(--muted);margin-top:3px}.qty{display:flex;align-items:center;gap:4px}.qty button{width:30px;height:30px;border:1px solid var(--border);background:#fff;border-radius:10px;font-weight:900}.qty b{min-width:22px;text-align:center;font-size:12px}
.empty{grid-column:1/-1;padding:16px;border:1px dashed var(--border);border-radius:16px;text-align:center;color:var(--muted);font-size:12px}.loading{opacity:.7}
@media(min-width:760px){.app{max-width:760px}.drawer{max-width:760px}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="app">
  <section class="hero">
    <h1>Taxas por Bairro</h1>
    <p>Consulte os valores e calcule quantas entregas quiser.</p>
    <a class="back" href="{{ back_href or url_for('portal_cooperado') }}">← Voltar</a>
  </section>

  <section class="section">
    <div class="select-row">
      <select id="contract">
        <option value="">Selecione o estabelecimento</option>
        {% for t in tabelas %}<option value="{{ t.id }}">{{ t.titulo }}</option>{% endfor %}
      </select>
      <button class="clear" id="clearBtn">Zerar</button>
    </div>

    <div class="mode">
      <button id="consultBtn" class="active">Consultar</button>
      <button id="calcBtn">Calcular</button>
    </div>

    <div class="search-wrap">
      <span>⌕</span><input id="search" placeholder="Buscar bairro">
    </div>

    <div class="last">
      <div class="label">Última consulta</div>
      <div class="name" id="consultName">Selecione um estabelecimento</div>
      <div class="price" id="consultPrice">—</div>
      <div class="meta" id="consultMeta">Depois toque em um bairro.</div>
    </div>
  </section>

  <section class="section">
    <div class="headline"><strong>Bairros</strong><span id="countLabel">0 bairros</span></div>
    <div id="grid" class="grid"><div class="empty">Selecione um estabelecimento.</div></div>
  </section>

  <section class="section info" id="infoBox"><div class="g-title">Informações da tabela</div><div id="infoList"></div></section>
  <section class="section guarantees" id="guarantees"><div class="g-title">Garantidos</div><div id="gGrid"></div></section>
</div>

<div class="drawer">
  <button class="total-btn" id="summaryToggle"><div><span>Total</span><strong id="totalValue">R$ 0,00</strong></div><div class="r"><b id="totalQty">0</b><small>entregas</small></div></button>
  <div class="summary" id="summaryPanel"><div class="summary-head">Resumo do cálculo</div><div class="summary-list" id="summaryList"><div class="empty">Nenhuma entrega adicionada.</div></div></div>
</div>

<script>
let contractId="";
let mode="consult";
let counts={};
let data=[];
const money=v=>new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format(Number(v||0));
const key=(name,city)=>name+"||"+city;

function colorClass(v){return "c"+(Math.abs(Math.round(Number(v||0)))%6)}
function sortedData(){return [...data].sort((a,b)=>(a.bairro||"").localeCompare(b.bairro||"","pt-BR"))}

function renderGrid(){
  const q=document.getElementById("search").value.trim().toLocaleLowerCase("pt-BR");
  const rows=sortedData().filter(x=>!q||(x.bairro||"").toLocaleLowerCase("pt-BR").includes(q));
  countLabel.textContent=`${rows.length} bairros`;
  if(!rows.length){grid.innerHTML='<div class="empty">Nenhum bairro encontrado.</div>';return}
  grid.innerHTML=rows.map(x=>{
    const qty=counts[key(x.bairro,x.cidade||"")]||0;
    const meta=mode==="calc"?(qty?`${qty} entrega${qty>1?"s":""}`:"Toque para somar"):"Toque para consultar";
    return `<button class="card ${colorClass(x.valor)}" data-name="${x.bairro.replace(/"/g,'&quot;')}" data-city="${(x.cidade||"").replace(/"/g,'&quot;')}" data-price="${x.valor}">
      ${qty?`<div class="pill">${qty}</div>`:""}
      <div><div class="name">${x.bairro}</div><div class="city">${x.cidade||""}</div></div>
      <div><div class="price">${money(x.valor)}</div><div class="meta">${meta}</div></div>
    </button>`;
  }).join("");

  grid.querySelectorAll(".card").forEach(btn=>btn.addEventListener("click",()=>{
    const name=btn.dataset.name, city=btn.dataset.city, price=Number(btn.dataset.price);
    consultName.textContent=name; consultPrice.textContent=money(price); consultMeta.textContent=city||"";
    if(mode==="calc"){const k=key(name,city);counts[k]=(counts[k]||0)+1;renderGrid();renderSummary()}
  }));
}

function renderSummary(){
  const rows=[];
  for(const [k,qty] of Object.entries(counts)){
    if(qty<=0)continue;
    const [name,city]=k.split("||");
    const item=data.find(x=>x.bairro===name&&(x.cidade||"")===city);
    if(item)rows.push({name,city,price:Number(item.valor||0),qty});
  }
  rows.sort((a,b)=>a.name.localeCompare(b.name,"pt-BR"));
  totalQty.textContent=rows.reduce((s,r)=>s+r.qty,0);
  totalValue.textContent=money(rows.reduce((s,r)=>s+r.qty*r.price,0));
  if(!rows.length){summaryList.innerHTML='<div class="empty">Nenhuma entrega adicionada.</div>';return}
  summaryList.innerHTML=rows.map(r=>`<div class="row"><div><div class="n">${r.name}</div><div class="m">${r.city?r.city+" • ":""}${money(r.price)} × ${r.qty} = <b>${money(r.price*r.qty)}</b></div></div><div class="qty"><button data-act="minus" data-name="${r.name}" data-city="${r.city}">−</button><b>${r.qty}</b><button data-act="plus" data-name="${r.name}" data-city="${r.city}">+</button></div></div>`).join("");
  summaryList.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{const k=key(b.dataset.name,b.dataset.city);counts[k]=Math.max(0,(counts[k]||0)+(b.dataset.act==="plus"?1:-1));renderSummary();renderGrid()}));
}


function parseRecognizedText(raw){
  const lines=(raw||"").split(/\r?\n/).map(x=>x.replace(/\s+/g," ").trim()).filter(Boolean);
  const bairros=[], garantidos=[], infos=[];
  const seen=new Set();
  let areaPrice=null;

  const moneyEnd=/^(.*?)\s*(?:R\$\s*)?(\d{1,3}(?:[.,]\d{2})?)$/i;
  const moneyAny=/(?:R\$\s*)?(\d{2,3}(?:[.,]\d{2})?)/i;
  const timeAny=/(\d{1,2}\s*h(?:\s*(?:às|as|a|-)\s*\d{1,2}\s*h)?)/i;
  const areaRx=/^(?:área|area|faixa|grupo)\s*[A-Z0-9ºª.-]*/i;
  const blocked=/^(?:área|areas|area|bairro|bairros|valor|valores|taxa|taxas|entrega|entregas|garantido|garantidos|horário|horario|tabela|observações|observacoes|cnpj|cpf|motoqueiro|base|motoqueiro base|horário base|horario base|valor base|serviço|servico|serviços|servicos|compras|transferência|transferencia|loja|lojas)$/i;

  const cleanName=s=>(s||"")
    .replace(/^(?:área|area|faixa|grupo|zona)\s*[A-Z0-9ºª.-]*\s*[:\-–—]?\s*/i,"")
    .replace(/\s+(?:R\$\s*)?\d{1,3}(?:[.,]\d{2})?\s*$/i,"")
    .replace(/^[\s\-–—:;|]+|[\s\-–—:;|]+$/g,"")
    .trim();

  const invalidText=s=>{
    const n=cleanName(s);
    return !n || blocked.test(n) || areaRx.test(n) ||
      /^cnpj\b/i.test(n) ||
      /\d{2}\.?\d{3}\.?\d{3}\/?\d{4}-?\d{2}/.test(n) ||
      /^(?:motoqueiro\s+base|hor[aá]rio\s+base|valor\s+base)$/i.test(n);
  };

  const splitNames=s=>{
    const clean=cleanName(s);
    if(invalidText(clean))return [];
    return clean.split(/\s*(?:\/|;|•|\||\s+e\s+)\s*/i)
      .map(cleanName)
      .filter(x=>!invalidText(x) && x.length<=70 && x.split(/\s+/).length<=7);
  };

  const add=(name,price)=>{
    splitNames(name).forEach(n=>{
      const k=n.toLocaleLowerCase("pt-BR")+"|"+Number(price).toFixed(2);
      if(seen.has(k))return;
      seen.add(k);
      bairros.push({bairro:n,cidade:"",valor:Number(price)});
    });
  };

  lines.forEach((ln,idx)=>{
    const low=ln.toLocaleLowerCase("pt-BR");
    const ctx=[lines[idx-1]||"",ln,lines[idx+1]||""].join(" ");

    if(low.includes("garant")){
      const mv=ctx.match(moneyAny);
      if(mv){
        const valor=Number(mv[1].replace(",","."));
        if(valor>=50&&valor<=500){
          const mh=ctx.match(timeAny);
          garantidos.push({
            descricao:ln.replace(/R\$\s*\d+(?:[.,]\d{2})?/ig,"").trim()||"Garantido",
            horario:mh?mh[1]:"",
            valor
          });
        }
      }
      return;
    }

    if(/motoqueiro\s+base|hor[aá]rio\s+base|valor\s+base|cnpj|cpf|servi[cç]o\s+de\s+compras|transfer[eê]ncia\s+entre\s+lojas/i.test(low))return;

    if(/hor[aá]rio|taxa administrativa/i.test(low)) return;

    const m=ln.match(moneyEnd);
    if(m){
      const price=Number(m[2].replace(",","."));
      if(areaRx.test(ln)){
        if(price>=5&&price<=50)areaPrice=price;
        return;
      }
      if(price>=5&&price<=50){
        const names=splitNames(m[1]);
        if(names.length){names.forEach(n=>add(n,price));return}
      }
    }

    if(areaPrice!==null && !invalidText(ln)){
      add(ln,areaPrice);
    }
  });

  bairros.sort((a,b)=>a.bairro.localeCompare(b.bairro,"pt-BR"));
  const uniqGarantidos=garantidos.filter((g,i,a)=>a.findIndex(x=>
    (x.descricao||"")===(g.descricao||"") &&
    (x.horario||"")===(g.horario||"") &&
    Number(x.valor||0)===Number(g.valor||0)
  )===i);
  return {bairros,garantidos:uniqGarantidos,informacoes:[]};
}

function loadTesseract(){
  if(window.Tesseract)return Promise.resolve();
  return new Promise((resolve,reject)=>{
    const s=document.createElement("script");
    s.src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
    s.onload=resolve;
    s.onerror=()=>reject(new Error("Não foi possível carregar o leitor da tabela."));
    document.head.appendChild(s);
  });
}

function parseRecognizedLayout(ocrData){
  const words=(ocrData?.words||[]).filter(w=>{
    const t=(w.text||"").trim();
    return t && w.bbox && Number.isFinite(w.bbox.x0) && Number.isFinite(w.bbox.y0);
  });
  if(!words.length)return parseRecognizedText(ocrData?.text||"");

  const norm=s=>(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().trim();
  const center=w=>({x:(w.bbox.x0+w.bbox.x1)/2,y:(w.bbox.y0+w.bbox.y1)/2});
  const blocked=/^(AREA|AREAS|GARANTIDO|GARANTIDOS|CNPJ|CPF|MOTOQUEIRO|BASE|MOTOQUEIRO BASE|HORARIO BASE|VALOR BASE|SERVICO|SERVICOS|COMPRAS|TRANSFERENCIA|LOJA|LOJAS|SEGUNDA|TERCA|QUARTA|QUINTA|SEXTA|SABADO|DOMINGO|FERIADO|FERIADOS)$/;

  // Detecta os cabeçalhos ÁREA 01...ÁREA 06.
  const areaHeaders=[];
  words.forEach(w=>{
    const n=norm(w.text);
    if(n!=="AREA")return;
    const c=center(w);
    const num=words.filter(v=>{
      const cv=center(v), nv=norm(v.text);
      return /^\d{1,2}$/.test(nv) && Math.abs(cv.y-c.y)<22 && cv.x>c.x && cv.x-c.x<100;
    }).sort((a,b)=>center(a).x-center(b).x)[0];
    areaHeaders.push({x:num?(c.x+center(num).x)/2:c.x,y:c.y});
  });
  areaHeaders.sort((a,b)=>a.x-b.x);
  if(areaHeaders.length<2)return parseRecognizedText(ocrData?.text||"");

  const parseNum=w=>{
    const raw=(w.text||"").replace(/[^\d,.]/g,"");
    if(!raw)return null;
    const v=Number(raw.replace(/\./g,"").replace(",","."));
    return Number.isFinite(v)?v:null;
  };

  const areas=areaHeaders.map((h,i)=>{
    const left=i===0?-Infinity:(areaHeaders[i-1].x+h.x)/2;
    const right=i===areaHeaders.length-1?Infinity:(h.x+areaHeaders[i+1].x)/2;
    const prices=words.filter(w=>{
      const c=center(w),v=parseNum(w);
      return c.x>=left&&c.x<right&&c.y>h.y+8&&c.y<h.y+130&&v!==null&&v>=5&&v<=50;
    }).sort((a,b)=>center(a).y-center(b).y);
    return {...h,left,right,price:prices.length?parseNum(prices[0]):null,priceY:prices.length?center(prices[0]).y:h.y+80};
  }).filter(a=>a.price!==null);

  if(areas.length<2)return parseRecognizedText(ocrData?.text||"");

  // Limite inferior: antes do bloco "GARANTIDOS".
  const gw=words.filter(w=>/^GARANTIDOS?$/.test(norm(w.text)));
  const bottomCut=gw.length?Math.min(...gw.map(w=>center(w).y))-18:Math.max(...words.map(w=>center(w).y))+1;

  const bairros=[], seen=new Set();
  areas.forEach(a=>{
    const colWords=words.filter(w=>{
      const c=center(w),n=norm(w.text);
      return c.x>=a.left&&c.x<a.right&&c.y>a.priceY+18&&c.y<bottomCut &&
        !blocked.test(n)&&!/^R\$?$/.test(n)&&!/^\d+[,.]?\d*$/.test(n);
    }).sort((u,v)=>center(u).y-center(v).y||center(u).x-center(v).x);

    const lines=[];
    colWords.forEach(w=>{
      const c=center(w);
      let line=lines.find(L=>Math.abs(L.y-c.y)<13);
      if(!line){line={y:c.y,words:[]};lines.push(line)}
      line.words.push(w);
    });

    lines.sort((a,b)=>a.y-b.y).forEach(line=>{
      line.words.sort((u,v)=>center(u).x-center(v).x);
      let text=line.words.map(w=>w.text).join(" ").replace(/[•·]/g," ").replace(/\s+/g," ").trim();
      text=text.replace(/^[-–—:;|]+|[-–—:;|]+$/g,"").trim();
      const n=norm(text);
      if(!text||blocked.test(n)||/^CNPJ\b/.test(n)||/\d{2}\.?\d{3}\.?\d{3}\/?\d{4}-?\d{2}/.test(text))return;
      if(/MOTOQUEIRO\s+BASE|HORARIO\s+BASE|VALOR\s+BASE/.test(n))return;
      if(text.length>55||text.split(/\s+/).length>6)return;
      const k=n+"|"+a.price;
      if(seen.has(k))return;
      seen.add(k);
      bairros.push({bairro:text,cidade:"",valor:a.price});
    });
  });

  // Garantidos ficam fora da grade de bairros.
  const textParsed=parseRecognizedText(ocrData?.text||"");
  const garantidos=(textParsed.garantidos||[]).filter(g=>Number(g.valor||0)>=50);
  bairros.sort((a,b)=>a.bairro.localeCompare(b.bairro,"pt-BR"));
  return {bairros,garantidos,informacoes:[]};
}

async function recognizeImage(url){
  await loadTesseract();
  const result=await Tesseract.recognize(url,"por",{
    logger:m=>{
      if(m.status==="recognizing text"){
        const pct=Math.round((m.progress||0)*100);
        grid.innerHTML='<div class="empty loading">Lendo a tabela… '+pct+'%</div>';
      }
    }
  });
  return parseRecognizedLayout(result?.data||{});
}

async function loadContract(id){
  contractId=id; counts={}; data=[]; renderSummary();
  guarantees.classList.remove("show"); infoBox.classList.remove("show");
  grid.innerHTML='<div class="empty loading">Lendo a tabela…</div>';
  if(!id){countLabel.textContent="0 bairros";grid.innerHTML='<div class="empty">Selecione um estabelecimento.</div>';return}
  try{
    const r=await fetch(`/tabelas/${id}/dados`,{credentials:"same-origin",cache:"no-store"});
    const j=await r.json();
    if(!r.ok||!j.ok)throw new Error(j.erro||"Falha ao ler tabela");
    data=j.bairros||[];

    let autoGarantidos=j.garantidos_extraidos||[];
    let autoInfos=j.informacoes||[];

    if((j.tipo_arquivo==="imagem" || j.erro==="imagem") && !data.length){
      const ocr=await recognizeImage(j.arquivo_visualizacao);
      data=ocr.bairros||[];
      autoGarantidos=[...autoGarantidos,...(ocr.garantidos||[])];
      autoInfos=[...autoInfos,...(ocr.informacoes||[])];
    }

    consultName.textContent=j.titulo||"Tabela";
    consultPrice.textContent="—";
    consultMeta.textContent=j.descricao||j.arquivo_nome||"Toque em um bairro.";

    const manual=j.garantidos||[];
    const gs=[...manual,...autoGarantidos].filter((g,i,a)=>a.findIndex(x=>(x.descricao||"")=== (g.descricao||"") && (x.horario||"")===(g.horario||"") && Number(x.valor||0)===Number(g.valor||0))===i);
    if(gs.length){gGrid.innerHTML=gs.map(g=>`<div class="g-line"><div><div class="d">${g.descricao||"Garantido"}</div><div class="h">${g.horario||""}</div></div><div class="v">${money(g.valor)}</div></div>`).join("");guarantees.classList.add("show")}

    const infos=[];
    infoBox.classList.remove("show")

    if(j.erro && j.erro!=="imagem" && !data.length){grid.innerHTML=`<div class="empty">${j.erro}</div>`;countLabel.textContent="0 bairros";return}
    if(!data.length){grid.innerHTML='<div class="empty">Não consegui reconhecer bairros e valores automaticamente nesta tabela.</div>';countLabel.textContent="0 bairros";return}
    renderGrid();
  }catch(e){grid.innerHTML=`<div class="empty">Não foi possível ler esta tabela: ${e.message}</div>`;countLabel.textContent="0 bairros"}
}

consultBtn.onclick=()=>{mode="consult";consultBtn.classList.add("active");calcBtn.classList.remove("active");renderGrid()}
calcBtn.onclick=()=>{mode="calc";calcBtn.classList.add("active");consultBtn.classList.remove("active");renderGrid()}
clearBtn.onclick=()=>{counts={};renderGrid();renderSummary()}
const contractSelect=document.getElementById("contract");
const searchInput=document.getElementById("search");
const summaryToggleBtn=document.getElementById("summaryToggle");

searchInput.oninput=renderGrid;
contractSelect.onchange=e=>loadContract(e.target.value);
summaryToggleBtn.onclick=()=>summaryPanel.classList.toggle("open");
renderSummary();

// Safari/iPhone pode restaurar automaticamente a última opção selecionada
// depois do carregamento. Executa logo após o DOM e novamente em seguida.
const loadSelected=()=>{ if(contractSelect.value) loadContract(contractSelect.value); };
loadSelected();
setTimeout(loadSelected,250);
</script>
</body>
</html>
