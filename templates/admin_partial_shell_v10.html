<body>
  {% include '_admin_nav_v10.html' %}
  <main class="v10-partial-page">
    <div class="v10-partial-head">
      <h1>{{ page_title }}</h1>
      <div id="v10Status" class="v10-partial-status"><span class="spinner-border"></span> Carregando somente esta aba...</div>
    </div>
    <div id="v10PartialMount"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
  (function(){
    const mount=document.getElementById('v10PartialMount');
    const status=document.getElementById('v10Status');
    const base={{ partial_url|tojson }};
    let controller=null;

    function setLoading(on,text){
      if(!status)return;
      status.innerHTML=on?'<span class="spinner-border"></span> '+(text||'Carregando...'):(text||'Pronto');
    }

    function executeScripts(root){
      root.querySelectorAll('script').forEach(old=>{
        const s=document.createElement('script');
        [...old.attributes].forEach(a=>s.setAttribute(a.name,a.value));
        s.textContent=old.textContent;
        old.replaceWith(s);
      });
    }

    function buildPartialUrl(form){
      const u=new URL(base,location.origin);
      if(form){
        const fd=new FormData(form);
        [...u.searchParams.keys()].forEach(k=>{
          if(!['tab','legacy','ajax_partial'].includes(k))u.searchParams.delete(k);
        });
        for(const [k,v] of fd.entries())if(v!==''&&v!=null)u.searchParams.append(k,v);
      }
      u.searchParams.set('legacy','1');
      u.searchParams.set('ajax_partial',{{ active_tab|tojson }});
      u.searchParams.set('tab',{{ active_tab|tojson }});
      return u.toString();
    }

    async function load(url){
      if(controller)controller.abort();
      controller=new AbortController();
      setLoading(true,'Carregando somente esta aba...');
      try{
        const r=await fetch(url||base,{credentials:'same-origin',cache:'no-store',headers:{'X-Requested-With':'XMLHttpRequest'},signal:controller.signal});
        if(!r.ok)throw new Error('HTTP '+r.status);
        mount.innerHTML=await r.text();
        executeScripts(mount);
        bind();
        setLoading(false,'Pronto');
      }catch(e){
        if(e.name==='AbortError')return;
        mount.innerHTML='<div class="alv8-card"><strong>Não foi possível carregar esta aba.</strong><br><small>'+String(e.message||e)+'</small></div>';
        setLoading(false,'Falha ao carregar');
      }
    }

    function bindBenefitPreview(){
      if ({{ active_tab|tojson }} !== 'beneficios') return;
      const sec = mount.querySelector('#beneficios');
      if (!sec) return;

      const money = v => 'R$ ' + Number(v || 0).toLocaleString('pt-BR', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
      const valueOf = el => {
        const n = parseFloat(String(el?.value ?? '').replace(',', '.'));
        return Number.isFinite(n) ? Math.max(0, n) : 0;
      };
      const ids = el => Array.from(el?.selectedOptions || []).map(o => String(o.value));

      function calc(prefix){
        const unit = sec.querySelector('#'+prefix+'_valor_unit');
        const bens = sec.querySelector('#'+prefix+'_beneficiarios');
        const isen = sec.querySelector('#'+prefix+'_isencoes');
        const badge = sec.querySelector('#'+prefix+'_badge');
        const detail = sec.querySelector('#'+prefix+'_preview_detail');
        const hidden = sec.querySelector('#'+prefix+'_valor_total') ||
                       sec.querySelector('input[name="'+prefix+'_valor"]');
        if (!unit || !bens || !isen) return;

        const recebedores = ids(bens);
        const isentos = ids(isen);
        const naoPagam = new Set(recebedores.concat(isentos));
        const totalAtivos = bens.options.length;
        const pagantes = Math.max(0, totalAtivos - naoPagam.size);
        const total = valueOf(unit) * recebedores.length;
        const porPagante = pagantes > 0 ? total / pagantes : 0;

        if (badge) badge.textContent = 'Prévia: ' + money(porPagante) + ' por pagante';
        if (detail) detail.textContent =
          'Recebem: ' + recebedores.length +
          ' · Isentos: ' + isentos.length +
          ' · Pagantes: ' + pagantes +
          ' · Total: ' + money(total);
        if (hidden) hidden.value = total.toFixed(2);
      }

      ['hosp','farm','alim'].forEach(prefix=>{
        const unit = sec.querySelector('#'+prefix+'_valor_unit');
        const bens = sec.querySelector('#'+prefix+'_beneficiarios');
        const isen = sec.querySelector('#'+prefix+'_isencoes');
        unit?.addEventListener('input', ()=>calc(prefix));
        bens?.addEventListener('change', ()=>calc(prefix));
        isen?.addEventListener('change', ()=>calc(prefix));
        calc(prefix);
      });

      const form = sec.querySelector('#form-beneficios');
      form?.addEventListener('submit', ()=>{
        ['hosp','farm','alim'].forEach(calc);
      });
    }

    function bind(){
      bindBenefitPreview();
      mount.querySelectorAll('form').forEach(form=>{
        if(form.dataset.v10Bound)return;
        form.dataset.v10Bound='1';
        form.addEventListener('submit',async ev=>{
          const method=(form.method||'get').toLowerCase();
          if(method==='get'){
            ev.preventDefault();
            await load(buildPartialUrl(form));
            return;
          }
          ev.preventDefault();
          setLoading(true,'Salvando...');
          try{
            const r=await fetch(form.action||location.href,{method:method.toUpperCase(),body:new FormData(form),credentials:'same-origin',headers:{'X-Requested-With':'XMLHttpRequest'}});
            if(!r.ok && r.status!==302)throw new Error('HTTP '+r.status);
            await load(buildPartialUrl());
          }catch(e){alert('Não foi possível salvar: '+(e.message||e));setLoading(false,'Falha ao salvar')}
        });
      });

      mount.querySelectorAll('a[href]').forEach(a=>{
        if(a.dataset.v10Bound)return;
        const href=a.getAttribute('href')||'';
        if(!/\/delete(?:\?|$)|\/excluir(?:\?|$)/.test(href))return;
        a.dataset.v10Bound='1';
        a.addEventListener('click',async ev=>{
          ev.preventDefault();
          if(!confirm('Confirmar exclusão?'))return;
          try{await fetch(a.href,{credentials:'same-origin',headers:{'X-Requested-With':'XMLHttpRequest'}});await load(buildPartialUrl())}catch(e){alert('Não foi possível excluir.')}
        });
      });
    }

    load(base);
  })();
  </script>
<script id="coopex-v11-nav">(function(){document.querySelectorAll('.alv8-group>button').forEach(btn=>{if(btn.dataset.v11bound)return;btn.dataset.v11bound='1';btn.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();const g=btn.parentElement;document.querySelectorAll('.alv8-group').forEach(x=>{if(x!==g)x.classList.remove('open')});g.classList.toggle('open')})});document.addEventListener('click',()=>document.querySelectorAll('.alv8-group').forEach(x=>x.classList.remove('open')));})();</script></body>
