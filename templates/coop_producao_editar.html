<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Corrigir produção</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"><style>body{background:#f4f7ff;font-family:Inter,Arial}.wrap{max-width:620px;margin:auto;padding:16px}.card{border:0;border-radius:20px;box-shadow:0 12px 35px rgba(15,23,42,.08)}.btn-primary{background:#2747d9;border:0}</style></head><body><main class="wrap"><a href="/coop/producao" class="btn btn-outline-primary mb-3">Voltar</a><div class="card p-4"><h1 class="h4 fw-bold">Corrigir produção</h1><p class="text-muted">{{ item.restaurante.nome }} · {{ item.data.strftime('%d/%m/%Y') }} · {{ item.hora_inicio }}{% if item.hora_fim %}–{{ item.hora_fim }}{% endif %}</p>{% if item.motivo_recusa %}<div class="alert alert-danger"><strong>Motivo:</strong> {{ item.motivo_recusa }}</div>{% endif %}<form method="post" class="row g-3"><div class="col-6"><label class="form-label fw-bold">Quantidade</label><input class="form-control" type="number" min="1" name="qtd_entregas" value="{{ item.qtd_entregas }}" required></div><div class="col-6"><label class="form-label fw-bold">Valor unitário</label><input class="form-control" type="number" min="0" step="0.01" name="valor_unitario" value="{{ '%.2f'|format(item.valor_unitario or 0) }}" required></div><div class="col-12"><label class="form-label fw-bold">Descrição</label><input class="form-control" name="descricao" value="{{ item.descricao or '' }}"></div><div class="col-12 d-grid"><button class="btn btn-primary btn-lg">Corrigir e reenviar</button></div></form></div></main></body></html>
