<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <title>Entrar · COOPEX</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <style>
    :root{
      --blue:#0957e8;
      --blue2:#0751d8;
      --navy:#061547;
      --text:#34405f;
      --muted:#6f789b;
      --line:#cfe0ff;
      --bg1:#eef8ff;
      --bg2:#f9fcff;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif}
    body{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:28px;
      background:
        radial-gradient(circle at 18% 18%,rgba(255,255,255,.95) 0 11%,transparent 35%),
        linear-gradient(145deg,var(--bg1),var(--bg2));
      color:var(--navy);
    }
    .login-card{
      width:min(500px,100%);
      background:#fff;
      border-radius:26px;
      padding:38px 42px 28px;
      box-shadow:0 18px 60px rgba(30,84,150,.09);
    }
    .eyebrow{
      margin:0 0 14px;
      color:var(--blue);
      font-size:16px;
      line-height:1.1;
      font-weight:900;
      letter-spacing:-.03em;
      text-transform:uppercase;
    }
    h1{
      margin:0 0 26px;
      color:#031443;
      font-size:23px;
      line-height:.98;
      letter-spacing:-.045em;
      font-weight:900;
    }
    .alert{
      border-radius:14px;
      padding:13px 15px;
      margin:0 0 18px;
      font-weight:700;
      background:#fff3f3;
      border:1px solid #ffcaca;
      color:#a40000;
    }
    label.field-label{
      display:block;
      margin:0 0 9px;
      color:var(--text);
      font-size:17px;
      line-height:1.1;
      font-weight:800;
    }
    .field{
      width:100%;
      height:52px;
      border:2px solid var(--line);
      border-radius:14px;
      display:flex;
      align-items:center;
      background:#fff;
      margin-bottom:20px;
      transition:border-color .15s, box-shadow .15s;
    }
    .field:focus-within{
      border-color:#8db7ff;
      box-shadow:0 0 0 4px rgba(9,87,232,.07);
    }
    .field input{
      min-width:0;
      width:100%;
      height:100%;
      border:0;
      outline:0;
      background:transparent;
      padding:0 16px;
      color:var(--navy);
      font-size:17px;
      font-weight:500;
    }
    .field input::placeholder{color:#7580a7;opacity:1}
    .toggle-pass{
      flex:0 0 52px;
      width:52px;
      height:100%;
      border:0;
      background:transparent;
      color:#66719a;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
    }
    .toggle-pass svg{width:25px;height:25px;display:block}
    .options{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      margin:0 0 24px;
      flex-wrap:wrap;
    }
    .remember{
      display:flex;
      align-items:center;
      gap:10px;
      color:#071441;
      font-size:16px;
      cursor:pointer;
      user-select:none;
    }
    .remember input{
      appearance:none;
      width:30px;
      height:30px;
      border:2px solid #b5cff8;
      border-radius:8px;
      margin:0;
      display:grid;
      place-content:center;
      background:#fff;
    }
    .remember input:checked{background:var(--blue);border-color:var(--blue)}
    .remember input:checked::after{
      content:"";
      width:14px;
      height:8px;
      border-left:3px solid #fff;
      border-bottom:3px solid #fff;
      transform:rotate(-45deg) translateY(-2px);
    }
    .forgot{
      color:var(--blue);
      text-decoration:none;
      font-size:16px;
      font-weight:500;
    }
    .submit{
      width:100%;
      height:58px;
      border:0;
      border-radius:17px;
      background:linear-gradient(90deg,var(--blue),var(--blue2));
      color:#fff;
      font-size:38px;
      font-weight:900;
      cursor:pointer;
      box-shadow:0 9px 22px rgba(9,87,232,.16);
    }
    .footer{
      text-align:center;
      color:#6370a0;
      font-size:17px;
      margin-top:46px;
    }
    @media(max-width:760px){
      body{align-items:flex-start;padding:18px 14px}
      .login-card{
        margin-top:7vh;
        width:100%;
        border-radius:24px;
        padding:34px 22px 28px;
      }
      .eyebrow{font-size:16px;margin-bottom:16px;white-space:nowrap}
      h1{font-size:42px;margin-bottom:30px}
      label.field-label{font-size:19px}
      .field{height:62px;border-radius:15px;margin-bottom:22px}
      .field input{font-size:18px;padding:0 18px}
      .toggle-pass{flex-basis:56px;width:56px}
      .toggle-pass svg{width:27px;height:27px}
      .options{gap:12px;margin:0 0 25px}
      .remember{font-size:16px;gap:10px}
      .remember input{width:32px;height:32px;border-radius:7px}
      .remember input:checked::after{width:15px;height:8px;border-left-width:3px;border-bottom-width:3px}
      .forgot{font-size:16px}
      .submit{height:64px;font-size:24px;border-radius:15px}
      .footer{font-size:17px;margin-top:52px}
    }
    @media(max-width:390px){
      .eyebrow{font-size:14px}
      h1{font-size:37px}
      .options{align-items:flex-start}
      .forgot{margin-left:auto}
    }
  </style>
</head>
<body>
  <main class="login-card">
    <p class="eyebrow">ACESSO COOPEX (ESTABELECIMENTOS)</p>
    <h1>Entrar na sua conta</h1>

    {% with msgs = get_flashed_messages() %}
      {% if msgs %}<div class="alert">{{ msgs[0] }}</div>{% endif %}
    {% endwith %}
    {% if erro_login %}<div class="alert">{{ erro_login }}</div>{% endif %}

    <form method="POST" action="{{ url_for('login') }}" id="loginForm" autocomplete="on">
      <label class="field-label" for="usuario">Usuário ou e-mail</label>
      <div class="field">
        <input id="usuario" name="usuario" required autocomplete="username"
               autocapitalize="none" spellcheck="false"
               placeholder="Digite seu usuário ou e-mail">
      </div>

      <label class="field-label" for="senha">Senha</label>
      <div class="field">
        <input type="password" id="senha" name="senha" required
               autocomplete="current-password" placeholder="Digite sua senha">
        <button class="toggle-pass" type="button" id="togglePass" aria-label="Mostrar ou ocultar senha">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
      </div>

      <div class="options">
        <label class="remember">
          <input type="checkbox" id="saveCreds">
          <span>Lembrar acesso</span>
        </label>
        <a class="forgot" href="#" onclick="return false;">Esqueci minha senha</a>
      </div>

      <button class="submit" type="submit">Entrar</button>
    </form>

    <div class="footer">COOPEX Entregas</div>
  </main>

  <script>
    (() => {
      const user = document.getElementById('usuario');
      const pass = document.getElementById('senha');
      const save = document.getElementById('saveCreds');
      const form = document.getElementById('loginForm');
      const toggle = document.getElementById('togglePass');

      toggle?.addEventListener('click', () => {
        pass.type = pass.type === 'password' ? 'text' : 'password';
        pass.focus();
      });

      const savedUser = localStorage.getItem('coopex_user');
      const savedPwd = localStorage.getItem('coopex_pwd');
      if (savedUser && savedPwd) {
        user.value = savedUser;
        pass.value = savedPwd;
        save.checked = true;
      }

      form?.addEventListener('submit', () => {
        if (save.checked) {
          localStorage.setItem('coopex_user', user.value);
          localStorage.setItem('coopex_pwd', pass.value);
        } else {
          localStorage.removeItem('coopex_user');
          localStorage.removeItem('coopex_pwd');
        }
      });
    })();
  </script>
</body>
</html>
