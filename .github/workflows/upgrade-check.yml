name: COOPEX upgrade check

on:
  push:
    branches:
      - main
      - feature/producao-cooperado-admin-rapido
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      FLASK_ENV: development
      FLASK_SECURE_COOKIES: "0"
      INIT_DB_ON_START: "0"
      SECRET_KEY: test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m py_compile app.py coopex_upgrade.py enhanced_app.py production_scale_flow.py production_scale_patch.py production_ui_patch.py production_ui_finalize.py performance_ui_fix.py performance_ui_hotfix.py performance_query_override.py production_shift_time_fix.py performance_ui_finalize.py menu_horizontal_enforcer.py cooperative_notifications_ui.py operational_rules_v5.py approval_rejection_v5.py approval_return_dashboard_v5.py admin_launch_sync_v5.py admin_ui_v6.py admin_runtime_v7.py admin_light_v8.py admin_light_v8_bridge.py admin_preserve_v9.py admin_v10_fix.py gunicorn_conf.py tests/smoke_upgrade.py
      - name: Validate Jinja templates
        run: |
          python - <<'PY'
          from pathlib import Path
          from jinja2 import Environment
          env = Environment()
          templates = (
              'coop_producao.html','coop_producao_editar.html','coop_agenda.html','painel_cooperado.html',
              '_coop_timeline.html','_rest_approvals_tabs.html','rest_producoes_pendentes.html',
              'restaurante_dashboard.html','restaurantes_tabelas.html','admin_dashboard.html',
              'admin_avaliacoes.html','admin_tabelas.html','admin_documentos.html','admin_avisos.html',
              'admin_light_v8.html','editar_tabelas.html','editar_documentos.html',
              'admin_producoes_pendentes.html','admin_rapido.html','_admin_nav_v10.html',
              'admin_partial_shell_v10.html','admin_establishments_v10.html','admin_blitz_v10.html',
          )
          for name in templates:
              env.parse((Path('templates') / name).read_text(encoding='utf-8'))
          print('templates ok')
          PY
      - name: Validate exact shift rules
        run: |
          python - <<'PY'
          from datetime import date
          from types import SimpleNamespace
          import production_shift_time_fix as shifts
          assert shifts.exact_scale_date(SimpleNamespace(data='07/08/26-SEX')) == date(2026, 8, 7)
          assert shifts.upgrade._times_from_text('18:00 às 22:00') == ('18:00', '22:00')
          assert shifts.upgrade._times_from_text('17:30 às 22:30') == ('17:30', '22:30')
          assert shifts.upgrade._times_from_text('11:00 às 15:00') == ('11:00', '15:00')
          print('exact shift rules ok')
          PY
      - name: Validate admin V10 consolidation
        run: |
          python - <<'PY'
          from datetime import date
          from pathlib import Path
          import approval_rejection_v5 as rejection
          import approval_return_dashboard_v5 as approval
          import admin_runtime_v7 as runtime
          import operational_rules_v5 as ui
          import admin_light_v8 as light
          import admin_light_v8_bridge as bridge
          import admin_preserve_v9 as preserve
          import admin_v10_fix as v10

          app = light.app
          transformed = ('admin_light_v8.html','admin_dashboard.html','admin_lancamentos.html')
          for name in transformed:
              source, _, _ = app.jinja_loader.get_source(app.jinja_env, name)
              app.jinja_env.parse(source)

          approvals = Path('templates/_rest_approvals_tabs.html').read_text(encoding='utf-8')
          nav = Path('templates/_admin_nav_v10.html').read_text(encoding='utf-8')
          finance = Path('templates/admin_partial_shell_v10.html').read_text(encoding='utf-8')
          establishments = Path('templates/admin_establishments_v10.html').read_text(encoding='utf-8')
          blitz = Path('templates/admin_blitz_v10.html').read_text(encoding='utf-8')

          assert 'Recusar e bloquear' in approvals
          assert app.view_functions['rest_producao_recusar'] is rejection.rest_reject_and_lock
          assert app.view_functions['rest_producao_aprovar'] is approval.rest_approve_return_dashboard
          assert app.view_functions['admin_light_scale'] is v10._admin_light_scale_v10
          assert app.view_functions['admin_light_swaps'] is v10._admin_light_swaps_v10
          assert app.view_functions['admin_light_coop_save'] is preserve._admin_light_coop_save_full
          assert app.jinja_env.filters['brl'] is v10.brl
          assert v10.brl(1219.82) == '1.219,82'

          source, _, _ = app.jinja_loader.get_source(app.jinja_env, 'admin_light_v8.html')
          assert 'considerar_periodo' not in source
          assert 'admin_v10_finance' in source
          assert 'admin_v10_establishments' in source
          assert 'admin_v10_blitz' in source
          assert 'swap_rows' in source
          assert 'normV10' in source
          assert 'Blitz' in nav and 'Receitas Coop' in nav
          assert 'ajax_partial' in finance
          assert 'Segunda a domingo' in establishments
          assert 'CNH e CRLV' in blitz

          with app.test_request_context('/admin?tab=resumo'):
              app.preprocess_request()
              assert runtime.app is app
              assert __import__('flask').request.args.get('data_inicio') == date.today().isoformat()
              assert __import__('flask').request.args.get('data_fim') == date.today().isoformat()
          with app.test_request_context('/admin/leve/cooperados'):
              assert ui._operational_filter_enabled() is False
          print('admin v10 consolidation ok')
          PY
      - name: Validate notification intervals
        run: |
          python - <<'PY'
          from pathlib import Path
          rest_js = Path('static/js/restaurante_v3.js').read_text(encoding='utf-8')
          coop_js = Path('static/js/cooperado_v4.js').read_text(encoding='utf-8')
          assert '5*60*1000' in rest_js
          assert '/static/avisos.mp3' in rest_js
          assert '/static/dinheiro.mp3' in coop_js
          assert 'coopex:lastIncomingEvaluation:' in coop_js
          print('notification rules ok')
          PY
      - name: Run production workflow smoke test
        run: PYTHONPATH=. python tests/smoke_upgrade.py
