name: COOPEX upgrade check

on:
  push:
    branches:
      - main
      - feature/producao-cooperado-admin-rapido
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      FLASK_ENV: development
      FLASK_SECURE_COOKIES: "0"
      INIT_DB_ON_START: "0"
      SECRET_KEY: test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m py_compile app.py coopex_upgrade.py enhanced_app.py production_scale_flow.py production_scale_patch.py production_ui_patch.py production_ui_finalize.py performance_ui_fix.py performance_ui_hotfix.py performance_ui_finalize.py gunicorn_conf.py tests/smoke_upgrade.py
      - name: Validate Jinja templates
        run: |
          python - <<'PY'
          from pathlib import Path
          from jinja2 import Environment
          env = Environment()
          templates = (
              'coop_producao.html',
              'coop_producao_editar.html',
              'coop_agenda.html',
              'painel_cooperado.html',
              '_coop_timeline.html',
              '_rest_approvals_tabs.html',
              'rest_producoes_pendentes.html',
              'restaurante_dashboard.html',
              'restaurantes_tabelas.html',
              'admin_producoes_pendentes.html',
              'admin_rapido.html',
          )
          for name in templates:
              path = Path('templates') / name
              env.parse(path.read_text(encoding='utf-8'))
          print('templates ok')
          PY
      - name: Validate transformed panels
        run: |
          python - <<'PY'
          import performance_ui_hotfix
          import performance_ui_finalize as ui

          app = ui.app
          for name in ('restaurante_dashboard.html', 'painel_cooperado.html'):
              source, _, _ = app.jinja_loader.get_source(app.jinja_env, name)
              app.jinja_env.parse(source)

          rest_source, _, _ = app.jinja_loader.get_source(app.jinja_env, 'restaurante_dashboard.html')
          coop_source, _, _ = app.jinja_loader.get_source(app.jinja_env, 'painel_cooperado.html')
          assert 'restaurante_v3.css' in rest_source
          assert 'SEJA BEM-VINDO' in rest_source
          assert '_rest_approvals_tabs.html' in rest_source
          assert 'restaurante_v3.js' in rest_source
          assert 'coopexPhotoModal' in rest_source
          assert "url_for('media_coop', coop_id=coop.id)" in rest_source
          assert 'data-coopex-producoes="1"' not in rest_source
          assert 'cooperado_producao_v3.css' in coop_source
          assert coop_source.count("{% include '_coop_timeline.html' %}") == 1
          history_pos = coop_source.find('Produções no período')
          timeline_pos = coop_source.find("{% include '_coop_timeline.html' %}")
          assert history_pos >= 0 and timeline_pos > history_pos
          assert 'data-week-production-card="1"' not in coop_source
          print('transformed panels ok')
          PY
      - name: Run production workflow smoke test
        run: PYTHONPATH=. python tests/smoke_upgrade.py
